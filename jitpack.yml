jdk:
  - openjdk21

install:
  # JitPack-Version (Commit/Tag) sichern – SDKMAN überschreibt sonst die $VERSION
  - export JITPACK_VER="$VERSION"

  # Maven modernisieren (für install-file 3.1.2)
  - sdk install maven 3.9.6
  - sdk use maven 3.9.6
  - mvn -v

  # Build fahren (alle Module)
  - ./gradlew --no-daemon -x test build

  # ---- PROXY installieren ----
  # Bevorzuge "plain" JAR, fallback auf Shadow(-all)
  - PROXY_JAR=$(ls proxy/build/libs/velocity-proxy-*.jar 2>/dev/null | grep -v '\-all\.jar' | head -n1 || ls proxy/build/libs/velocity-proxy-*-all.jar | head -n1)
  - '[ -f "$PROXY_JAR" ] || { echo "velocity-proxy JAR not found"; exit 1; }'
  - echo "Installing velocity-proxy: $PROXY_JAR as $JITPACK_VER"
  - mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file \
        -Dfile="$PROXY_JAR" \
        -DgroupId=com.github.EinfacheSache.Velocity \
        -DartifactId=velocity-proxy \
        -Dversion="$JITPACK_VER" \
        -Dpackaging=jar \
        -DgeneratePom=true

  # ---- API installieren ----
  - API_JAR=$(ls api/build/libs/velocity-api-*.jar | head -n1)
  - '[ -f "$API_JAR" ] || { echo "velocity-api JAR not found"; exit 1; }'
  - echo "Installing velocity-api: $API_JAR as $JITPACK_VER"
  - mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file \
        -Dfile="$API_JAR" \
        -DgroupId=com.github.EinfacheSache.Velocity \
        -DartifactId=velocity-api \
        -Dversion="$JITPACK_VER" \
        -Dpackaging=jar \
        -DgeneratePom=true
