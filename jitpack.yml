jdk:
  - openjdk21

install:
  - ./gradlew --no-daemon -x test build
  - JAR=$(ls proxy/build/libs/*-all.jar 2>/dev/null || ls proxy/build/libs/*.jar | head -n1); echo "Using $JAR"; mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file -Dfile="$JAR" -DgroupId=com.github.EinfacheSache.Velocity -DartifactId=proxy -Dversion=${VERSION} -Dpackaging=jar -DgeneratePom=true
