jdk:
  - openjdk21

install:
  - 'export JITPACK_VER="$VERSION"'
  - 'sdk install maven 3.9.6'
  - 'sdk use maven 3.9.6'
  - './gradlew --no-daemon -x test :velocity-proxy:shadowJar'
  - 'ALL=$(ls proxy/build/libs/velocity-proxy-*-all.jar | head -n1)'
  - '[ -f "$ALL" ] || { echo "Shadow (-all) jar not found"; exit 1; }'
  - 'echo "Publishing $ALL as velocity-proxy:$JITPACK_VER"'
  - 'mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file -Dfile="$ALL" -DgroupId=com.github.EinfacheSache.Velocity -DartifactId=velocity-proxy -Dversion="$JITPACK_VER" -Dpackaging=jar -DgeneratePom=true'
