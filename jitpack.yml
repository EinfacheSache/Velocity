jdk:
  - openjdk21

install:
  - 'export JITPACK_VER="$VERSION"'                               # Commit/Tag sichern
  - 'sdk install maven 3.9.6'
  - 'sdk use maven 3.9.6'
  - './gradlew --no-daemon -x test :velocity-proxy:shadowJar'     # Shadow-JAR bauen
  - 'ALL=$(ls proxy/build/libs/velocity-proxy-*-all.jar | head -n1)'
  - '[ -f "$ALL" ] || { echo "Shadow (-all) jar not found"; exit 1; }'
  - 'echo "Publishing $ALL as velocity-fat:$JITPACK_VER"'
  - 'mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file -Dfile="$ALL" -DgroupId=com.github.EinfacheSache.Velocity -DartifactId=velocity-fat -Dversion="$JITPACK_VER" -Dpackaging=jar -DgeneratePom=true'
  - 'REPO=$(mvn -q -DforceStdout help:evaluate -Dexpression=settings.localRepository)'
  - 'ls -l "$REPO/com/github/EinfacheSache/Velocity/velocity-fat/$JITPACK_VER"'
